  <line x1="430" y1="230" x2="729" y2="119" stroke="#16a34a" stroke-width="3" marker-end="url(#arrowGreen2)"/>
  <text x="600" y="105" fill="#16a34a" font-size="14" font-weight="bold">A·v = (8, 3)</text>
  <text x="500" y="255" fill="#374151" font-size="13" font-weight="bold">after (x stretched ×2)</text>
