<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 260" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowDim" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="500" height="260" fill="#ffffff"/>

  <!-- frustum fill -->
  <polygon points="180,100 420,40 420,220 180,160" fill="#bfdbfe" fill-opacity="0.55" stroke="none"/>

  <!-- field of view lines -->
  <line x1="60" y1="130" x2="460" y2="30" stroke="#111827" stroke-width="2"/>
  <line x1="60" y1="130" x2="460" y2="230" stroke="#111827" stroke-width="2"/>

  <!-- centerline (dashed) -->
  <line x1="60" y1="130" x2="460" y2="130" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- near plane -->
  <line x1="180" y1="100" x2="180" y2="160" stroke="#dc2626" stroke-width="3"/>
  <text x="150" y="185" fill="#dc2626" font-size="13" font-weight="bold">near</text>

  <!-- far plane -->
  <line x1="420" y1="40" x2="420" y2="220" stroke="#2563eb" stroke-width="3"/>
  <text x="405" y="240" fill="#2563eb" font-size="13" font-weight="bold">far</text>

  <!-- eye -->
  <circle cx="60" cy="130" r="5" fill="#111827"/>
  <text x="15" y="115" fill="#111827" font-size="12" font-weight="bold">Eye</text>

  <!-- fov angle arc label -->
  <text x="95" y="105" fill="#374151" font-size="12">fov</text>

  <!-- axis labels -->
  <text x="465" y="134" fill="#6b7280" font-size="13">z</text>
  <text x="465" y="235" fill="#374151" font-size="12">visible region = frustum (shaded)</text>
</svg>
